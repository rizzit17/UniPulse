server:
  port: 0

spring:
  application:
    name: unipulse-analytics-service-test

  datasource:
    url: jdbc:h2:mem:analyticsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS analytics
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: analytics

  flyway:
    enabled: false

  data:
    mongodb:
      auto-index-creation: false

  kafka:
    bootstrap-servers: localhost:9092

