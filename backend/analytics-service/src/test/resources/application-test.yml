server:
  port: 0

spring:
  application:
    name: unipulse-analytics-service-test

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

  datasource:
    url: jdbc:h2:mem:analyticsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS analytics
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: analytics

  flyway:
    enabled: false

unipulse:
  jwt:
    secret: unipulse-development-jwt-hmac-sha256-signing-key-32bytes
  internal:
    token: test-internal-token
