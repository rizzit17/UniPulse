server:
  port: 8082

spring:
  application:
    name: unipulse-assignment-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/unipulse}
    username: ${SPRING_DATASOURCE_USERNAME:unipulse}
    password: ${SPRING_DATASOURCE_PASSWORD:unipulse_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AssignmentHikariPool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: unipulse-assignment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

unipulse:
  assignment:
    strategy: ${UNIPULSE_ASSIGNMENT_STRATEGY:LEAST_LOADED}
    enabled: ${UNIPULSE_ASSIGNMENT_ENABLED:true}
