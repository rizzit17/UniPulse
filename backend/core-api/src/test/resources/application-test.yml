server:
  port: 0

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:unipulse_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

unipulse:
  jwt:
    secret: unipulse-development-jwt-hmac-sha256-signing-key-32bytes
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
  outbox:
    enabled: false
  sla:
    scheduler:
      enabled: false
