<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="4" fill="#16150F" />
  <rect x="1" y="1" width="46" height="46" rx="3" stroke="#D9A21B" stroke-width="2" />
  <!-- Subtle crosshair grid lines -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#2A281E" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="4" y1="24" x2="44" y2="24" stroke="#2A281E" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Bold U Monogram -->
  <path
    d="M 10 10 V 26 C 10 32 14.5 36 21 36 H 23"
    stroke="#F1EDE3"
    stroke-width="3.5"
    stroke-linecap="square"
  />

  <!-- Bold P Monogram Loop -->
  <path
    d="M 27 36 V 10 H 36 C 40 10 42 12.5 42 16.5 C 42 20.5 40 23 36 23 H 27"
    stroke="#F1EDE3"
    stroke-width="3.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Dynamic SLA Pulse Waveform -->
  <path
    d="M 3 24 H 13 L 18 12 L 24 36 L 30 15 L 35 24 H 45"
    stroke="#D9A21B"
    stroke-width="3"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Beacon Node -->
  <circle cx="24" cy="36" r="2.5" fill="#B5432B" />
</svg>